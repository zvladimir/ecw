[package]
name = "ecw"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["Zibtsev Vladimir <zibtsev.vladimir@gmail.com>"]
license = "MIT"
description = "ECW (Engineers' Circuit Workbench): electronics calculators for engineers"
repository = "https://github.com/zvladimir/ecw"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ecw-core = { path = "../crates/ecw-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
