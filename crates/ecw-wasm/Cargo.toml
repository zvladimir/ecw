[package]
name = "ecw-wasm"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["Zibtsev Vladimir <zibtsev.vladimir@gmail.com>"]
license = "MIT"
description = "WebAssembly build of the ECW calculation core for the browser version"
repository = "https://github.com/zvladimir/ecw"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ecw-core = { path = "../ecw-core" }
serde_json = "1"
wasm-bindgen = "0.2"
